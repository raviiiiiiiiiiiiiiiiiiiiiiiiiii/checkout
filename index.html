<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UPI Payment</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #fff; color: #111; margin:0; padding:40px 10px; }
  h2 { font-size:22px; margin-bottom:10px; }
  #amountDisplay { font-size:18px; margin-bottom:20px; }
  #qr img { border:1px solid #ddd; border-radius:10px; padding:10px; background:#fafafa; }
  .footer { font-size:13px; color:#888; margin-top:30px; }
</style>
</head>
<body>
  <h2>Scan the QR to complete your payment</h2>
  <p id="amountDisplay"></p>
  <div id="qr"></div>
  <div class="footer">UPI Payment Secure Page</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const params = new URLSearchParams(window.location.search);

  // 1️⃣ Get amount
  const rawAmount = params.get("amount") || "0";
  const amount = parseFloat(rawAmount.replace(/[^0-9.]/g, "")) || 0;

  // 2️⃣ Get UPI ID
  const upiId = params.get("upiid") || "default@upi";

  // 3️⃣ Get order number: first try query param, then hash
  let order = params.get("order") || window.location.hash.replace("#", "") || "0";

  // keep only digits
  const digitsOnly = order.replace(/\D/g, "");

  // 4️⃣ Get last two digits for paisa
  const lastTwo = digitsOnly.slice(-2) || "0";

  // 5️⃣ Add last two digits as paisa
  const finalAmount = amount + Number(lastTwo)/100;
  const finalAmountFixed = finalAmount.toFixed(2);

  // 6️⃣ Build UPI link
  const upiLink = `upi://pay?pa=${encodeURIComponent(upiId)}&am=${encodeURIComponent(finalAmountFixed)}&cu=INR&tn=Order%20${encodeURIComponent(digitsOnly)}`;

  // 7️⃣ Generate QR
  const qr = document.getElementById("qr");
  const img = document.createElement("img");
  img.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiLink)}`;
  img.alt = "UPI QR Code";
  qr.appendChild(img);

  // 8️⃣ Show final amount
  document.getElementById("amountDisplay").textContent = `Amount: ₹${finalAmountFixed}`;
});
</script>
</body>
</html>
