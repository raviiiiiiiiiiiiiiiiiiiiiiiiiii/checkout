<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UPI Payment</title>
<style>
  body {
    font-family: "Inter", Arial, sans-serif;
    background: #fff;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .container {
    text-align: center;
    max-width: 360px;
    width: 100%;
    border: 1px solid #eaeaea;
    border-radius: 20px;
    overflow: hidden;
  }

  .header {
    background: #114b33;
    color: #fff;
    padding: 40px 20px;
    border-bottom: 1px solid #e5e5e5;
  }

  .biz-name {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 5px;
  }

  .trusted {
    font-size: 13px;
    opacity: 0.9;
  }

  .price-summary {
    margin-top: 20px;
    font-size: 15px;
    font-weight: 500;
  }

  .amount {
    font-size: 28px;
    font-weight: 700;
    margin-top: 5px;
  }

  .scan-text {
    font-size: 16px;
    font-weight: 600;
    margin: 25px 0 15px;
    color: #222;
  }

  #qr img {
    border-radius: 10px;
    background: #f3f3f3;
    padding: 10px;
    width: 200px;
    height: 200px;
  }

  .footer {
    margin-top: 25px;
    font-size: 13px;
    color: #555;
    font-weight: 500;
  }

  .upi-icons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin: 15px 0 25px;
  }

  .upi-icons img {
    height: 28px;
    width: auto;
    opacity: 0.95;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="biz-name" id="bizName">Business Name</div>
      <div class="trusted">Rapid Pay Trusted Business</div>
      <div class="price-summary">Price Summary</div>
      <div class="amount" id="amountDisplay">₹0</div>
    </div>

    <div class="scan-text">Scan to Pay</div>
    <div id="qr"></div>

    <div class="footer">Scan using any UPI app</div>

    <div class="upi-icons">
      <img src="https://cdn.worldvectorlogo.com/logos/phonepe-1.svg" alt="PhonePe">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Google_Pay_Logo.svg" alt="GPay">
      <img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/BHIM_logo.svg" alt="BHIM">
    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const params = new URLSearchParams(window.location.search);
  
  // Business name
  const biz = params.get("biz") || "Business Name";
  document.getElementById("bizName").textContent = biz;

  // Amount
  const rawAmount = params.get("amount") || "0";
  const amount = parseFloat(rawAmount.replace(/[^0-9.]/g, "")) || 0;

  // UPI ID
  const upiId = params.get("upiid") || "default@upi";

  // Order number
  let order = params.get("order") || window.location.hash.replace("#", "") || "0";
  const digitsOnly = order.replace(/\D/g, "");
  const lastTwo = digitsOnly.slice(-2) || "0";
  const finalAmount = amount + Number(lastTwo)/100;
  const finalAmountFixed = finalAmount.toFixed(2);

  // UPI link
  const upiLink = `upi://pay?pa=${encodeURIComponent(upiId)}&am=${encodeURIComponent(finalAmountFixed)}&cu=INR&tn=Order%20${encodeURIComponent(digitsOnly)}`;

  // Generate QR
  const qr = document.getElementById("qr");
  const img = document.createElement("img");
  img.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiLink)}`;
  img.alt = "UPI QR Code";
  qr.appendChild(img);

  // Display amount
  document.getElementById("amountDisplay").textContent = `₹${finalAmountFixed}`;
});
</script>
</body>
</html>
